{% extends 'base.html' %} {% block page_title %}
  SignIn
{% endblock %} {% block bodyclass %}
  login-page bg-body-secondary
{% endblock %} {% block bodycontent %}
  <main class="login-box">
    <h1 class="login-logo"><a href="{{ url_for('user_profile', id: 42, tab: 'posts', _external: true) }}"><b>{{ app_name|upper }}</b></a></h1>
    <!-- /.login-logo -->
    <div class="card">
      <div class="card-body login-card-body">
        <p class="login-box-msg">Sign in to start your session</p>

        <form id="form-login" action="" method="post">
          <label class="visually-hidden" for="loginEmail">Email</label>
          <div class="input-group mb-3">
            <input id="loginEmail" name="username" type="email" class="form-control" placeholder="Email" />
            <div class="input-group-text">
              <span class="bi bi-envelope"></span>
            </div>
          </div>
          <label class="visually-hidden" for="loginPassword">Password</label>
          <div class="input-group mb-3">
            <input id="loginPassword" name="password" type="password" class="form-control" placeholder="Password" />
            <div class="input-group-text">
              <span class="bi bi-lock-fill"></span>
            </div>
          </div>
          <!-- begin::Row -->
          <div class="row">
            <div class="col-8">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault" />
                <label class="form-check-label" for="flexCheckDefault">Remember Me</label>
              </div>
            </div>
            <!-- /.col -->
            <div class="col-4">
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Sign In</button>
              </div>
            </div>
            <!-- /.col -->
          </div>
          <!-- end::Row -->
        </form>
      </div>
      <!-- /.login-card-body -->
    </div>
  </main>
  <!-- /.login-box -->
{% endblock %} {% block scripts %}
  <script>
    $(document).ready(function () {
      //  console.log(local.getEndpoint("/session"));
      
      $('#form-login').submit(function (e) {
        e.preventDefault()
    
        // Example AJAX call usage
        api.ajaxRequest({
          endpoint: 'signin',
          method: 'POST',
          dataParam: $(this).serialize(),
          onSuccess: (data) => {
            console.log('Handled success:', data)
          },
          onError: (errorData) => {
            //alert(errorData.message)
            // $.toast(errorData.message)
            //$.fn.stackAlert('✅ No message entered', 'info', 5000, 'top-right');
            // $.fn.stackAlert(errorData.message, 'primary', 5000, 'top-right')
            $.toast({
              heading: 'Information',
              text: errorData.message,
              icon: 'error',
              position: 'bottom-center'
            })
            //console.log("Handled error:", errorData);
          }
        })
      })
    })
  </script>
{% endblock %}
